tool:
  name: ion_mill_phm18
  label: Ion mill (PHM 2018)
  description: "PHM 2018 documented channels. Units and limits are not asserted beyond the recorded alert multiplier."
baseline:
  mode: nominal_file
  file: ../../benchmarks/datasets/phm2018/sample/M02_DC_01_nominal_sample.csv
signals:
  - {name: FLOWCOOLFLOWRATE, label: Coolant flow, unit: null, alert_at: 3.5}
  - {name: FLOWCOOLPRESSURE, label: Coolant pressure, unit: null, alert_at: 3.5}
  - {name: IONGAUGEPRESSURE, label: Ion gauge pressure, unit: null, alert_at: 3.5}
  - {name: ETCHBEAMVOLTAGE, label: Beam voltage, unit: null, alert_at: 3.5}
  - {name: ETCHBEAMCURRENT, label: Beam current, unit: null, alert_at: 3.5}
  - {name: ETCHSUPPRESSORVOLTAGE, label: Suppressor voltage, unit: null, alert_at: 3.5}
  - {name: ETCHSUPPRESSORCURRENT, label: Suppressor current, unit: null, alert_at: 3.5}
checks:
  - id: coolant_loop
    label: Coolant loop fault
    kind: equipment_fault
    must_be_unusual:
      - {signal: FLOWCOOLFLOWRATE, direction: any}
      - {signal: FLOWCOOLPRESSURE, direction: any}
    must_stay_normal: []
    action: INSPECT_COMPONENT
    advice: "Inspect the coolant loop and its sensors. Do not adjust the recipe."
