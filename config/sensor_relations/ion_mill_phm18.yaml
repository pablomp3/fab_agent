version: 1
name: ion_mill_phm18
provenance: "PHM 2018 documented signal groups"
signals:
  - {name: FLOWCOOLFLOWRATE, unit: null, robust_z_threshold: null, threshold_source: null}
  - {name: FLOWCOOLPRESSURE, unit: null, robust_z_threshold: null, threshold_source: null}
  - {name: IONGAUGEPRESSURE, unit: null, robust_z_threshold: null, threshold_source: null}
  - {name: ETCHBEAMVOLTAGE, unit: null, robust_z_threshold: null, threshold_source: null}
  - {name: ETCHBEAMCURRENT, unit: null, robust_z_threshold: null, threshold_source: null}
  - {name: ETCHSUPPRESSORVOLTAGE, unit: null, robust_z_threshold: null, threshold_source: null}
  - {name: ETCHSUPPRESSORCURRENT, unit: null, robust_z_threshold: null, threshold_source: null}
groups:
  flowcool: [FLOWCOOLFLOWRATE, FLOWCOOLPRESSURE]
  chamber: [IONGAUGEPRESSURE]
  ion_source: [ETCHBEAMVOLTAGE, ETCHBEAMCURRENT, ETCHSUPPRESSORVOLTAGE, ETCHSUPPRESSORCURRENT]
roles:
  beam_voltage: [ETCHBEAMVOLTAGE]
  grid_current: [ETCHBEAMCURRENT]
scenarios:
  flowcool:
    signals:
      - {name: FLOWCOOLFLOWRATE, unit: null, robust_z_threshold: 3.5, threshold_source: "standard_robust_mad_multiplier=3.5"}
      - {name: FLOWCOOLPRESSURE, unit: null, robust_z_threshold: 3.5, threshold_source: "standard_robust_mad_multiplier=3.5"}
    predicates:
      primary_signals: [FLOWCOOLFLOWRATE, FLOWCOOLPRESSURE]
    rules:
      equipment_fault:
        require_all: [has_primary_signal_anomaly]
        forbid_any: [has_missing_required_evidence]
    candidate:
      claim: flowcool subsystem fault
      hypothesis_class: equipment_fault
      cited_signals: [FLOWCOOLFLOWRATE, FLOWCOOLPRESSURE]
      root_cause: equipment_fault
      failure_mode: Flowcool subsystem fault; confirm the specific mode during inspection.
      mechanism: The configured relationship links coolant flow and pressure; the physical mechanism is not asserted by this configuration.
    supported_action: INSPECT_COMPONENT
