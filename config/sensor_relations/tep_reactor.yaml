tool:
  name: tep_reactor
  label: TEP reactor
  description: "TEP documented cause and symptom variables. The configured pattern is a feed-flow and reactor-pressure excursion; it does not assert a physical mechanism."
baseline:
  mode: lead_in
  rows: 6
signals:
  - {name: "XMEAS(1)", label: A feed flow, unit: kscmh, alert_at: 3.5}
  - {name: "XMV(3)", label: A feed valve, unit: "%", alert_at: 3.5}
  - {name: "XMEAS(7)", label: Reactor pressure, unit: kPa, alert_at: 3.5}
checks:
  - id: feed_disturbance
    label: Feed-system disturbance
    kind: upstream_process
    must_be_unusual:
      - {signal: "XMEAS(1)"}
      - {signal: "XMEAS(7)"}
    must_stay_normal: []
    action: ESCALATE_TO_ENGINEER
    advice: "Ask an engineer to verify the A feed line and the reactor pressure response. Do not change the recipe."
